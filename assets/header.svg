<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf9e"/>
      <stop offset="0.55" stop-color="#ffb08a"/>
      <stop offset="1" stop-color="#f58f7c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffe0a8" stop-opacity="0"/>
    </radialGradient>
    <g id="petal"><rect width="8" height="8" fill="#ffd6e0"/><rect x="2" y="2" width="4" height="4" fill="#ffb3c7"/></g>
    <style>
      .p { animation: fall linear infinite; }
      @keyframes fall { 0% { transform: translate(0,-40px) rotate(0deg); opacity:0 } 10% {opacity:1} 90% {opacity:1} 100% { transform: translate(-120px,360px) rotate(260deg); opacity:0 } }
      .line { opacity:0; animation: cycle 12s infinite; }
      .l2 { animation-delay: 3s } .l3 { animation-delay: 6s } .l4 { animation-delay: 9s }
      @keyframes cycle { 0% {opacity:0; transform: translateY(8px)} 4% {opacity:1; transform: translateY(0)} 22% {opacity:1} 26% {opacity:0} 100% {opacity:0} }
      .float { animation: bob 4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle cx="930" cy="120" r="150" fill="url(#sun)"/>
  <circle cx="930" cy="120" r="46" fill="#fff1cf" opacity="0.9"/>

  <!-- far pixel hills -->
  <path d="M0 230 h80 v-20 h80 v-16 h96 v20 h120 v-28 h104 v24 h96 v-12 h120 v20 h112 v-30 h96 v18 h120 v-10 h176 V320 H0Z" fill="#e9837a" opacity="0.55"/>

  <!-- pixel sakura tree -->
  <g transform="translate(1000,96)">
    <rect x="44" y="96" width="16" height="96" fill="#7a4a3a"/>
    <rect x="28" y="120" width="16" height="10" fill="#7a4a3a"/>
    <g fill="#ffc2d4">
      <rect x="0" y="40" width="104" height="48"/><rect x="16" y="16" width="72" height="24"/><rect x="-16" y="64" width="40" height="32"/><rect x="80" y="60" width="40" height="36"/>
    </g>
    <g fill="#ff9fbd"><rect x="16" y="64" width="24" height="16"/><rect x="64" y="32" width="16" height="16"/><rect x="88" y="72" width="16" height="16"/></g>
  </g>

  <!-- grass strip -->
  <rect y="288" width="1200" height="32" fill="#8a5a44"/>
  <rect y="280" width="1200" height="12" fill="#7cc06a"/>
  <g fill="#62a856">
    <rect x="0" y="288" width="24" height="6"/><rect x="72" y="288" width="16" height="8"/><rect x="160" y="288" width="24" height="6"/><rect x="260" y="288" width="16" height="8"/><rect x="380" y="288" width="24" height="6"/><rect x="500" y="288" width="16" height="8"/><rect x="620" y="288" width="24" height="6"/><rect x="760" y="288" width="16" height="8"/><rect x="880" y="288" width="24" height="6"/><rect x="1010" y="288" width="16" height="8"/><rect x="1130" y="288" width="24" height="6"/>
  </g>

  <!-- falling petals -->
  <g>
    <use href="#petal" x="120" y="0" class="p" style="animation-duration:9s"/>
    <use href="#petal" x="300" y="0" class="p" style="animation-duration:11s;animation-delay:2s"/>
    <use href="#petal" x="520" y="0" class="p" style="animation-duration:8s;animation-delay:4s"/>
    <use href="#petal" x="700" y="0" class="p" style="animation-duration:10s;animation-delay:1s"/>
    <use href="#petal" x="880" y="0" class="p" style="animation-duration:12s;animation-delay:3s"/>
    <use href="#petal" x="1060" y="0" class="p" style="animation-duration:9s;animation-delay:5s"/>
    <use href="#petal" x="1180" y="0" class="p" style="animation-duration:10s;animation-delay:6s"/>
    <use href="#petal" x="420" y="0" class="p" style="animation-duration:13s;animation-delay:7s"/>
  </g>

  <!-- title -->
  <g class="float">
    <text x="84" y="150" font-size="104" font-weight="800" fill="#7a3b2e" opacity="0.25">DeLfi</text>
    <text x="78" y="144" font-size="104" font-weight="800" fill="#4a2418">DeLfi</text>
  </g>
  <text x="82" y="190" font-size="28" font-weight="600" fill="#5b2d22">Minecraft сервера под ключ</text>

  <g font-size="22" font-weight="600" fill="#8a3f2e">
    <text x="82" y="234" class="line l1">⚔ плагины на Paper под твою идею</text>
    <text x="82" y="234" class="line l2">🎬 ивенты, катсцены и боссы</text>
    <text x="82" y="234" class="line l3">🧪 сборки модов: спавн, лут, крафты</text>
    <text x="82" y="234" class="line l4">🌙 владелец сервера SleppyShel</text>
  </g>
</svg>
